<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>ModKreator</title>
<style>
  :root {
    --grass: #5d9c3a; --grass-dark: #3f6e26;
    --dirt: #7a5232; --dirt-dark: #4e3420;
    --stone: #8b8b8b; --stone-dark: #555;
    --sky: #87c8f0; --text: #fff; --ink: #2b1d12;
    --gold: #f2c230; --red: #c8442f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: flex; flex-direction: column;
    font: 700 22px/1.3 "Segoe UI", system-ui, sans-serif; color: var(--text);
    background: linear-gradient(var(--sky) 0 55%, var(--grass) 55% 58%, var(--dirt) 58%);
    user-select: none;
  }
  /* ponytail: pikselowy wygląd z CSS (ramki, cienie), bez assetów i fontów z Minecrafta */
  .block {
    background: var(--dirt); border: 4px solid var(--ink);
    box-shadow: inset -6px -6px 0 var(--dirt-dark), inset 6px 6px 0 #9c6b44;
  }
  button {
    font: inherit; color: var(--text); cursor: pointer;
    min-height: 88px; padding: 12px 28px; border: 4px solid var(--ink);
    background: var(--stone); text-shadow: 3px 3px 0 var(--ink);
    box-shadow: inset -6px -6px 0 var(--stone-dark), inset 6px 6px 0 #b5b5b5;
  }
  button:hover { filter: brightness(1.12); }
  button:active { box-shadow: inset 6px 6px 0 var(--stone-dark); }
  button:focus-visible { outline: 6px solid var(--gold); outline-offset: 2px; }
  button.green { background: var(--grass); box-shadow: inset -6px -6px 0 var(--grass-dark), inset 6px 6px 0 #7fbf5a; }
  button.red { background: var(--red); box-shadow: inset -6px -6px 0 #8a2a1c, inset 6px 6px 0 #e06a55; }
  .icon { font-size: 1.6em; vertical-align: middle; margin-right: 10px; text-shadow: none; }

  nav { display: flex; gap: 12px; padding: 12px; justify-content: center; }
  nav button { flex: 1; max-width: 280px; }
  nav button[aria-current="page"] { outline: 6px solid var(--gold); }

  main { flex: 1; display: flex; padding: 0 24px 24px; min-height: 0; }
  section { flex: 1; display: none; flex-direction: column; gap: 20px; padding: 28px; overflow: auto; }
  section.active { display: flex; }
  h1 { margin: 0; font-size: 40px; text-shadow: 4px 4px 0 var(--ink); }

  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
  li { display: flex; align-items: center; gap: 16px; padding: 14px 18px; background: rgba(0,0,0,.25); border: 3px solid var(--ink); }
  #start ul { grid-template-columns: 1fr 1fr; }
  li .state, li button { margin-left: auto; flex: none; }
  li .state { font-size: 1.4em; }
  li button { min-height: 64px; padding: 8px 18px; }
  .info small { display: block; font-size: 17px; font-weight: 600; }
  details { font-size: 16px; font-weight: 400; margin-top: 6px; user-select: text; }
  summary { cursor: pointer; font-weight: 700; }
  #mod-status pre { white-space: pre-wrap; max-height: 240px; overflow: auto; }

  .bubble { background: #fff; color: var(--ink); padding: 20px 24px; border: 4px solid var(--ink); max-width: 80%; }
  .bubble.me { align-self: flex-end; background: var(--gold); }
  .talk { flex: 1; display: flex; flex-direction: column; gap: 14px; overflow: auto; }
  /* Mikrofon: mały kwadrat obok „Wyślij”, sama ikonka (stan w title/aria-label) */
  #speak { width: 88px; padding: 0; flex: none; }
  #speak .icon { margin: 0; }
  #speak.rec { background: var(--red); box-shadow: inset -6px -6px 0 #8a2a1c, inset 6px 6px 0 #e06a55; }
  .talk-top { display: flex; align-items: center; gap: 16px; }
  .talk-top #active-mod { flex: 1; text-shadow: 3px 3px 0 var(--ink); }
  .talk-top button { min-height: 64px; padding: 8px 18px; }
  .ask { display: flex; gap: 12px; flex-wrap: wrap; }
  /* „Komputer myśli” – duży, pulsujący dymek z kołyszącą się ikoną i skaczącymi kropkami */
  .bubble.thinking { display: flex; align-items: center; gap: 18px; background: #fff3c4; border-color: var(--gold);
    font-size: 26px; animation: think-pulse 1.4s ease-in-out infinite; }
  .think-icon { font-size: 56px; line-height: 1; display: inline-block; animation: think-bob 1.2s ease-in-out infinite; }
  .dots { display: inline-flex; gap: 8px; margin-left: auto; }
  .dots i { width: 16px; height: 16px; background: var(--ink); animation: think-jump 1s ease-in-out infinite; }
  .dots i:nth-child(2) { animation-delay: .15s; }
  .dots i:nth-child(3) { animation-delay: .3s; }
  @keyframes think-pulse { 50% { box-shadow: 0 0 0 10px rgba(242, 194, 48, .55); } }
  @keyframes think-bob { 50% { transform: translateY(-8px) rotate(-10deg); } }
  @keyframes think-jump { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-14px); } }
  @media (prefers-reduced-motion: reduce) { .bubble.thinking, .think-icon, .dots i { animation: none; } }
  .ask button { min-height: 64px; padding: 8px 18px; }
  #mod-list li { cursor: default; }
  #mod-list input[type=checkbox] { width: 44px; height: 44px; flex: none; accent-color: var(--grass); cursor: pointer; }
  #mod-list li.active { outline: 6px solid var(--gold); }
  #mod-list .info { flex: 1; }
  #mod-list .info.pick { cursor: pointer; }
  #mod-list .info.pick:hover { text-decoration: underline; }
  #mod-list button.trash { width: 64px; padding: 0; }
  #mod-list button.trash .icon { margin: 0; }
  #mod-list li.confirm button { min-width: 0; }
  .row { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
  .row button { min-width: 260px; }
  #write { display: flex; gap: 12px; }
  #write input {
    flex: 1; min-width: 0; font: inherit; color: var(--ink); padding: 0 20px; min-height: 88px;
    background: #fff; border: 4px solid var(--ink); user-select: text;
  }
  #write input:focus-visible { outline: 6px solid var(--gold); outline-offset: 2px; }
  #no-mic { margin: 0; text-align: center; text-shadow: 3px 3px 0 var(--ink); }
</style>
</head>
<body>
  <nav>
    <button data-go="start"><span class="icon">🧰</span>Start</button>
    <button data-go="talk"><span class="icon">💬</span>Rozmowa</button>
    <button data-go="mod"><span class="icon">⛏️</span>Mój mod</button>
    <button id="lektor" aria-pressed="true"><span class="icon">🔊</span>Lektor wł.</button>
  </nav>

  <main>
    <!-- Start: kreator narzędzi (T-7, logika w tools.js) -->
    <section id="start" class="block">
      <h1>Cześć! Sprawdzam narzędzia</h1>
      <ul id="tool-list"></ul>
      <div class="row">
        <button id="recheck"><span class="icon">🔄</span>Sprawdź jeszcze raz</button>
        <button class="green" data-go="talk"><span class="icon">▶️</span>Dalej</button>
      </div>
    </section>

    <!-- Rozmowa: przycisk „mów”, pisanie (T-13) i lektor (logika w talk.js, T-10) -->
    <section id="talk" class="block">
      <div class="talk-top">
        <div id="active-mod"></div>
        <button id="new-mod"><span class="icon">➕</span>Nowy mod</button>
      </div>
      <div class="talk">
        <div class="bubble">🔊 Co dziś zbudujemy?</div>
      </div>
      <p id="no-mic" hidden>🎤❌ Nie widzę mikrofonu. Napisz, co chcesz zbudować!</p>
      <form id="write">
        <input id="write-text" aria-label="Napisz, co chcesz zbudować" placeholder="✏️ Napisz, co chcesz zbudować…" autocomplete="off" maxlength="500">
        <button type="button" id="speak" class="green" title="Mów" aria-label="Mów"><span class="icon">🎤</span></button>
        <button type="submit" class="green"><span class="icon">📨</span>Wyślij</button>
      </form>
    </section>

    <!-- Mój mod: lista modów (✔ = w grze, złota ramka = ten zmienia rozmowa, 🗑️ = kosz), Zagraj -->
    <section id="mod" class="block">
      <h1>Moje mody</h1>
      <p id="mod-empty" hidden>Nie masz jeszcze modów. Idź do „Rozmowa” i powiedz, co zbudować!</p>
      <ul id="mod-list"></ul>
      <div id="mod-status" class="info"></div>
      <div class="row">
        <button id="play" class="green"><span class="icon">🎮</span>Zagraj</button>
      </div>
    </section>
  </main>

<script src="talk.js"></script>
<script>
  function go(id) {
    document.querySelectorAll('section').forEach(s => s.classList.toggle('active', s.id === id));
    document.querySelectorAll('nav button').forEach(b =>
      b.dataset.go === id ? b.setAttribute('aria-current', 'page') : b.removeAttribute('aria-current'));
  }
  document.addEventListener('click', e => {
    const b = e.target.closest('[data-go]');
    if (b) go(b.dataset.go);
    if (b && b.dataset.go !== 'start') refreshMods(); // lista modów i „Zmieniasz: …” zawsze świeże
  });
  go('start');

  // Kreator startowy
  const TOOLS = { minecraft: ['🟩', 'Minecraft'], java: ['☕', 'Java'], fabric: ['🧵', 'Fabric'],
    claude: ['🤖', 'Claude'], codex: ['🎨', 'Codex'], whisper: ['🎤', 'Słuchanie'],
    piper: ['🔊', 'Lektor'] };
  const installing = new Set();
  const list = document.getElementById("tool-list");

  function renderTool(t) {
    const li = document.createElement('li');
    li.id = 'tool-' + t.id;
    li.innerHTML = `<span class="icon">${TOOLS[t.id][0]}</span><div class="info">${TOOLS[t.id][1]}<small></small></div>`;
    li.querySelector('small').textContent = t.text;
    if (t.fix === 'auto') {
      const b = document.createElement('button');
      b.className = 'green';
      b.textContent = '⬇️ Tak, pobierz';
      b.onclick = () => install(t.id, li);
      li.append(b);
    } else {
      const state = document.createElement('span');
      state.className = 'state';
      state.textContent = t.ok ? '✅' : t.fix === 'adult' ? '🙋' : t.optional ? '➖' : '⏸️';
      li.append(state);
    }
    if (t.adult) {
      const d = document.createElement('details');
      d.innerHTML = '<summary>Dla dorosłego</summary>';
      d.append(t.adult);
      li.querySelector('.info').append(d);
    }
    return li;
  }

  async function check() {
    if (!list.children.length)
      list.replaceChildren(...Object.keys(TOOLS).map(id => renderTool({ id, text: 'Sprawdzam…' })));
    const results = await window.tools.check();
    for (const t of results)
      if (!installing.has(t.id)) document.getElementById('tool-' + t.id).replaceWith(renderTool(t));
    if (document.getElementById('start').classList.contains('active'))
      speak(results.filter(t => !t.ok && !t.optional).map(t => `${TOOLS[t.id][1]}: ${t.text}`).join(' ') || 'Wszystko gotowe! Kliknij Dalej.');
  }

  async function install(id, li) {
    installing.add(id);
    li.querySelector('button').disabled = true;
    li.querySelector('small').textContent = 'Pobieram…';
    try {
      await window.tools.install(id);
      installing.delete(id);
      check();
    } catch (e) {
      installing.delete(id);
      li.replaceWith(renderTool({ id, fix: 'adult', text: 'Coś nie wyszło. Poproś dorosłego o pomoc.', adult: e.message }));
      speak('Coś nie wyszło. Poproś dorosłego o pomoc.');
    }
  }

  window.tools.onProgress((id, pct) => {
    const s = document.querySelector(`#tool-${id} small`);
    if (s) s.textContent = pct < 100 ? `Pobieram… ${pct}%` : 'Instaluję…';
  });
  document.getElementById('recheck').onclick = check;
  check();

  // Mój mod: Zagraj = zaznaczone mody do .minecraft/mods (odznaczone wyłączone) i launcher.
  const playBtn = document.getElementById('play');
  const modStatus = document.getElementById('mod-status');
  let modSpoken = '';
  // Gdy trwa praca na modach (mod:busy) „Zagraj” jest wyłączony i odlicza, ile jeszcze zostało (eta z mod:progress,
  // szacowane z czasów poprzednich buildów); bez szacunku – „Czekaj…”, po czasie – „Jeszcze chwilka…”.
  const PLAY_HTML = playBtn.innerHTML;
  let busyNow = false, etaEnd = null, tick = null;
  const fmtLeft = s => s > 90 ? `ok. ${Math.round(s / 60)} min` : `ok. ${s} s`;
  function renderPlay() {
    if (!busyNow) { playBtn.disabled = false; playBtn.innerHTML = PLAY_HTML; return; }
    playBtn.disabled = true;
    const left = etaEnd && Math.ceil((etaEnd - Date.now()) / 1000);
    playBtn.innerHTML = '<span class="icon">⏳</span>' +
      (etaEnd == null ? 'Czekaj…' : left > 0 ? `Jeszcze ${fmtLeft(left)}` : 'Jeszcze chwilka…');
  }
  window.mod.onBusy(on => {
    busyNow = on;
    if (!on) etaEnd = null;
    clearInterval(tick);
    tick = on ? setInterval(renderPlay, 1000) : null;
    renderPlay();
  });
  const setModStatus = (text, detail, eta) => {
    if (typeof eta === 'number') { etaEnd = Date.now() + eta * 1000; renderPlay(); }
    if (text !== modSpoken) speak(modSpoken = text); // lektor (T-8), bez powtórek przy liniach logu Gradle
    modStatus.textContent = text;
    if (detail) modStatus.append(Object.assign(document.createElement('small'), { textContent: detail }));
  };
  window.mod.onProgress(setModStatus);
  const modAction = async (btn, work) => {
    btn.disabled = true;
    try {
      setModStatus(await work());
    } catch (e) {
      setModStatus('Coś nie wyszło. Poproś dorosłego o pomoc.');
      const d = document.createElement('details');
      d.innerHTML = '<summary>Dla dorosłego</summary>';
      d.append(Object.assign(document.createElement('pre'), { textContent: e.message }));
      modStatus.append(d);
    }
    btn.disabled = btn === playBtn && busyNow;
  };
  playBtn.onclick = () => modAction(playBtn, async () => {
    for (const step of ['install', 'play']) await window.mod[step](); // install buduje zaznaczone mody
    return 'Minecraft się otwiera. Kliknij w nim „Graj”!';
  });

  // Lista modów: checkbox = mod jest w grze, klik w mod dziecka = ten zmienia rozmowa (złota ramka), kosz = usuń.
  // Na końcu mody znalezione w folderze mods gry (np. pobrane z internetu) – tylko w grze / poza grą / kosz.
  const modList = document.getElementById('mod-list');
  const activeMod = document.getElementById('active-mod');
  async function refreshMods() {
    let mods = [];
    try { mods = await window.mod.list(); } catch (e) { console.error(e); }
    document.getElementById('mod-empty').hidden = mods.length > 0;
    const active = mods.find(m => m.active);
    activeMod.textContent = active ? `✏️ Zmieniasz: ${active.name}` : '✏️ Nowy mod';
    modList.replaceChildren(...mods.map(m => {
      const li = document.createElement('li');
      li.classList.toggle('active', m.active);
      const box = Object.assign(document.createElement('input'), { type: 'checkbox', checked: m.selected, title: 'W grze' });
      box.setAttribute('aria-label', `${m.name} w grze`);
      box.onchange = () => window.mod.select(m.id, box.checked);
      const info = document.createElement('div');
      info.className = 'info';
      info.textContent = (m.own ? '' : '📦 ') + m.name;
      info.append(Object.assign(document.createElement('small'), {
        textContent: m.things.length ? m.things.join(' · ') : m.own ? 'Jeszcze pusty' : 'Mod z folderu gry' }));
      if (m.own && !m.active) {
        info.classList.add('pick');
        info.title = 'Kliknij, żeby zmieniać ten mod w rozmowie';
        info.onclick = async () => { await window.mod.activate(m.id); clearTalk(`Teraz zmieniamy „${m.name}”. Co dodać?`); refreshMods(); };
      }
      const trash = document.createElement('button');
      trash.className = 'trash';
      trash.innerHTML = '<span class="icon">🗑️</span>';
      trash.title = trash.ariaLabel = `Usuń „${m.name}”`;
      trash.onclick = () => askRemove(li, m);
      li.append(box, info, trash);
      return li;
    }));
  }
  refreshMods();

  // Kosz: najpierw pytanie w tym samym wierszu; usunięty mod trafia do folderu kosz (dorosły może go odzyskać).
  function askRemove(li, m) {
    const row = document.createElement('li');
    row.className = 'confirm';
    row.append(Object.assign(document.createElement('div'), { className: 'info', textContent: `Usunąć „${m.name}”?` }));
    const yes = Object.assign(document.createElement('button'), { className: 'red', innerHTML: '<span class="icon">🗑️</span>Tak, usuń' });
    const no = Object.assign(document.createElement('button'), { innerHTML: 'Nie' });
    yes.onclick = () => modAction(yes, async () => {
      try { return await window.mod.remove(m.id); }
      finally { refreshMods(); if (m.active) clearTalk('Co dziś zbudujemy?'); }
    });
    no.onclick = () => row.replaceWith(li);
    row.append(yes, no);
    li.replaceWith(row);
    speak(`Usunąć ${m.name}?`);
  }
</script>
</body>
</html>
